<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>声ストック</title>
<style>
:root{--bg:#f6f4ef;--fg:#16140f;--sub:#6b665a;--card:#ffffff;--line:#cfc9b9;--m:#2b5fd9;--f:#d9356b;--x:#e08a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--fg:#f3efe4;--sub:#a29d8e;--card:#1f1d17;--line:#4a463a;--m:#7aa2ff;--f:#ff7fa8;--x:#ffb84a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px}
textarea{width:100%;height:84px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);resize:none}
.row{display:flex;gap:8px;margin-top:8px}
button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:12px 6px;flex:1;color:#fff}
.m{background:var(--m)}.f{background:var(--f)}.x{background:var(--x);color:#16140f}.n{background:#7a5cc8}
.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.item p{margin:0 0 8px;font-size:17px;word-break:break-all;white-space:pre-wrap}
.item .row{margin-top:0}
.item button{padding:10px 4px;font-size:14px}
.item .del{flex:0 0 52px}
h2{font-size:15px;color:var(--sub);margin:20px 0 0;font-weight:600}
.speed{display:flex;align-items:center;gap:12px;margin-top:24px;font-size:15px}.speed span:last-child{min-width:3.2em;text-align:right}.speed input{flex:1;-webkit-appearance:none;appearance:none;height:40px;background:transparent;margin:0}.speed input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}.speed input::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:var(--m);margin-top:-14px;border:3px solid var(--bg)}.speed input::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}.speed input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--m);border:3px solid var(--bg)}
#note{font-size:12px;color:var(--sub);margin-top:6px;min-height:1em}
.tg.off{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
#big{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;overflow:hidden}
#big.on{display:flex}
#bigt{font-weight:900;line-height:1.15;word-break:break-all;white-space:pre-wrap;max-width:100%}
#bigh{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<h1>声ストック</h1>
<textarea id="in" placeholder="しゃべらせたい文章を入力"></textarea>
<div class="row">
<button class="m" data-v="p">再生</button>
<button class="x tg off" id="bigtg">大きく表示：オン</button>
</div>
<div class="row"><button class="f" id="rnd">返す言葉がない</button><button class="f" id="rnd2">返す言葉がない2</button></div>
<div class="speed"><span>高さ</span><input type="range" id="ptc" min="0.2" max="2" step="0.1" value="1"><span id="ptv">1.0</span></div>
<div class="speed"><span>速さ</span><input type="range" id="spd" min="0.5" max="1.4" step="0.1" value="1"><span id="spv">1.0倍</span></div>
<div class="row">
<button class="ghost" id="add">ストックに追加</button>
<button class="ghost" id="stop">停止</button>
</div>
<div id="note"></div>
<h2>ストック一覧</h2>
<div id="list"></div>
<div id="big"><div id="bigt"></div><div id="bigh">タップで閉じる</div></div>
<script>
var KEY='voicestock:items',items=[],voices=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(function(v){return /^ja/i.test(v.lang)})}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
else document.getElementById('note').textContent='このブラウザは音声再生に対応していません。';
function pick(re){for(var i=0;i<voices.length;i++){if(re.test(voices[i].name))return voices[i]}return null}
function speak(text){
  if(!text||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';
  u.pitch=parseFloat(document.getElementById('ptc').value);
  u.rate=parseFloat(document.getElementById('spd').value);
  if(voices[0])u.voice=voices[0];
  var my=++sid;
  showBig(text);
  speechSynthesis.speak(u);
}
var sid=0,bigOn=false,tg=document.getElementById('bigtg');
try{if(localStorage.getItem('voicestock:big')==='1')bigOn=true}catch(e){}
function showTg(){tg.textContent='大きく表示：'+(bigOn?'オン':'オフ');tg.classList.toggle('off',!bigOn)}
tg.addEventListener('click',function(){bigOn=!bigOn;if(!bigOn)hideBig();try{localStorage.setItem('voicestock:big',bigOn?'1':'0')}catch(e){}showTg()});
showTg();
function fitBig(){
  var s=document.getElementById('big'),t=document.getElementById('bigt'),w=s.clientWidth-32,h=s.clientHeight-80,lo=10,hi=600;
  while(lo<hi){var m=Math.ceil((lo+hi)/2);t.style.fontSize=m+'px';
    if(t.scrollWidth<=w+1&&t.scrollHeight<=h)lo=m;else hi=m-1;}
  t.style.fontSize=lo+'px';
}
function showBig(text){
  if(!bigOn)return;
  document.getElementById('bigt').textContent=text;
  document.getElementById('big').classList.add('on');fitBig();
}
function hideBig(){document.getElementById('big').classList.remove('on')}
function stopAll(){sid++;hideBig();if('speechSynthesis' in window)speechSynthesis.cancel()}
document.getElementById('big').addEventListener('click',stopAll);
window.addEventListener('resize',function(){if(document.getElementById('big').classList.contains('on'))fitBig()});
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
  var el=document.getElementById('list');
  if(!items.length){el.innerHTML='<p style="color:var(--sub);font-size:14px">まだありません。文章を入力して「ストックに追加」を押してください。</p>';return}
  el.innerHTML=items.map(function(t,i){
    return '<div class="item"><p>'+esc(t)+'</p><div class="row">'
    +'<button class="m" data-i="'+i+'" data-v="p">再生</button>'
    +'<button class="ghost" data-s="1">停止</button>'
    +'<button class="ghost del" data-d="'+i+'">削除</button></div></div>';
  }).join('');
}
var inp=document.getElementById('in');
var WHEN=['今日は','昨日は','今朝は','先週は','夜は','休みの日は','昼休みに'],
    WITH=['','友達と','家族と','ひとりで','兄と','同僚と'],
    PLACE=['公園で','カフェで','家で','駅前で','海辺で','学校で','キャンプ場で','庭で'],
    ACT=['カレーを食べた','ギターを弾いた','写真を撮った','本を読んだ','手紙を書いた','絵を描いた','映画を見た','昼寝をした','ラーメンを食べた','音楽を聴いた','おしゃべりをした','ゲームをした'],
    PAIRS=[['コーヒー','苦い'],['夕焼け','きれい'],['冬の朝','寒い'],['カレー','おいしい'],['子猫','かわいい'],['月曜日','少し憂うつ'],['この曲','なつかしい'],['夏の夜','気持ちいい'],['できたてのパン','いい匂い'],['雪','冷たい']],
    DAY=['明日は','週末は','来月は','今夜は'],
    PLAN=['映画を見に行こう','海に行きたい','早く寝よう','友達に会いたい','おいしいものを食べよう','散歩に出かけよう','ゆっくり休もう'],
    POOL=['今日もおつかれさま。','深呼吸すると、少し落ち着くよ。','困ったときは、まず水を飲もう。','小さな一歩でも、進めば前に行ける。','おなかがすいたから、何か食べよう。','空がきれいだったから、写真を撮った。','最近よく笑っている気がする。','失敗しても、また明日がある。','好きなことをしている時間が、一番たのしい。','今日は早めにお風呂に入ろう。','雨の日は、家でのんびりするのもいい。','ちょっと休憩してもいいよね。','新しいことを始めるのに、遅すぎることはない。','ありがとうって言うと、気持ちがいいね。'],
    lastRnd='';
function pickOne(a){return a[Math.floor(Math.random()*a.length)]}
function randomLine(){
  var t,n=0;
  do{
    var r=Math.floor(Math.random()*5),pr;
    if(r===0)t=pickOne(POOL);
    else if(r===1||r===4)t=pickOne(WHEN)+pickOne(WITH)+pickOne(PLACE)+pickOne(ACT)+'。';
    else if(r===2){pr=pickOne(PAIRS);t=pr[0]+'は'+pr[1]+'。'}
    else t=pickOne(DAY)+pickOne(PLAN)+'。';
    n++;
  }while(t===lastRnd&&n<10);
  lastRnd=t;return t;
}
document.getElementById('rnd').addEventListener('click',function(){inp.value=randomLine()});
var REACT=[['なるほど、そういう考え方もあるね。',0],['それはすごいね！',0],['わかる、それは大変だったね。',1],['へえ、それは知らなかった。',0],['たしかに、言われてみればそうかも。',0],['それは面白い話だね。',0],['うんうん、自分もそう思う。',0],['それは意外だった。',0],['いいね、前向きで素敵だと思う。',1],['そっか、よく頑張ったね。',1],['ちょっと待って、それ本当？',0],['それは楽しそうだね！',0]],
    FOLLOW=['もう少し詳しく聞かせて。','それでどうなったの？','そのあと何かあった？','また教えてね。','今度ゆっくり聞かせてね。'],
    SUPPORT=['応援してるよ。','無理しすぎないでね。','話してくれてありがとう。'],
    lastRep='';
function randomReply(){
  var t,n=0,r;
  do{
    r=pickOne(REACT);t=r[0];
    var x=Math.random();
    if(x<0.2){}
    else if(r[1]&&x<0.7)t+=pickOne(SUPPORT);
    else t+=pickOne(FOLLOW);
    n++;
  }while(t===lastRep&&n<10);
  lastRep=t;return t;
}
document.getElementById('rnd2').addEventListener('click',function(){inp.value=randomReply()});
document.querySelector('.row').addEventListener('click',function(e){
  var v=e.target.getAttribute('data-v');if(v)speak(inp.value.trim(),v);
});
document.getElementById('add').addEventListener('click',function(){
  var t=inp.value.trim();if(!t)return;items.unshift(t);save();render();inp.value='';
});
document.getElementById('stop').addEventListener('click',function(){stopAll()});
document.getElementById('list').addEventListener('click',function(e){
  var d=e.target.getAttribute('data-d'),i=e.target.getAttribute('data-i'),v=e.target.getAttribute('data-v');
  if(e.target.getAttribute('data-s')!==null){stopAll()}
  else if(d!==null){items.splice(+d,1);save();render()}
  else if(i!==null&&v)speak(items[+i],v);
});
var spd=document.getElementById('spd'),spv=document.getElementById('spv');
try{var s0=localStorage.getItem('voicestock:speed');if(s0)spd.value=s0}catch(e){}
function showSpd(){spv.textContent=parseFloat(spd.value).toFixed(1)+'倍'}
spd.addEventListener('input',function(){showSpd();try{localStorage.setItem('voicestock:speed',spd.value)}catch(e){}});
showSpd();
var ptc=document.getElementById('ptc'),ptv=document.getElementById('ptv');
try{var p0=localStorage.getItem('voicestock:pitch');if(p0)ptc.value=p0}catch(e){}
function showPtc(){ptv.textContent=parseFloat(ptc.value).toFixed(1)}
ptc.addEventListener('input',function(){showPtc();try{localStorage.setItem('voicestock:pitch',ptc.value)}catch(e){}});
showPtc();
render();
</script>
</body>
</html>
