<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>声ストック</title>
<style>
:root{--bg:#f6f4ef;--fg:#16140f;--sub:#6b665a;--card:#ffffff;--line:#cfc9b9;--m:#2b5fd9;--f:#d9356b;--x:#e08a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--fg:#f3efe4;--sub:#a29d8e;--card:#1f1d17;--line:#4a463a;--m:#7aa2ff;--f:#ff7fa8;--x:#ffb84a;color-scheme:dark}}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px}
textarea{width:100%;height:84px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);resize:none}
.row{display:flex;gap:8px;margin-top:8px}
button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:12px 6px;flex:1;color:#fff}
.m{background:var(--m)}.f{background:var(--f)}.x{background:var(--x);color:#16140f}.n{background:#7a5cc8}
.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.item p{margin:0 0 6px;font-size:15px;line-height:1.35;word-break:break-all;white-space:pre-wrap}
.item .row{margin-top:0;gap:6px}
.item button{padding:7px 4px;font-size:13px;border-radius:8px}
.item .del{flex:0 0 48px}
.fold{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:12px 10px;cursor:pointer}
.fold span{color:var(--sub);font-size:13px}
.fhead{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.fhead button{flex:0 0 auto;padding:7px 12px;font-size:13px}
#fp{display:none;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
#fp.on{display:block}
#fp input,#mv input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#fchips,#mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#mv{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:16px}
#mv.on{display:flex}
.mvc{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#mvt{font-size:14px;margin-bottom:10px;word-break:break-all;color:var(--sub);max-height:3.4em;overflow:hidden}
#mmsg{font-size:12px;color:var(--f);min-height:1em;margin-top:6px}
.chip{flex:0 0 auto;padding:6px 10px;font-size:13px;border-radius:16px}
h2{font-size:15px;color:var(--sub);margin:20px 0 0;font-weight:600}
.speed{display:flex;align-items:center;gap:12px;margin-top:24px;font-size:15px}.speed span:last-child{min-width:3.2em;text-align:right}.speed input{flex:1;-webkit-appearance:none;appearance:none;height:40px;background:transparent;margin:0}.speed input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--line)}.speed input::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:var(--m);margin-top:-14px;border:3px solid var(--bg)}.speed input::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}.speed input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--m);border:3px solid var(--bg)}
#note{font-size:12px;color:var(--sub);margin-top:6px;min-height:1em}
.tg.off{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
#big{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;overflow:hidden}
#big.on{display:flex}
#bigt{font-weight:900;line-height:1.15;word-break:break-all;white-space:pre-wrap;max-width:100%}
#bigh{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<h1>声ストック</h1>
<textarea id="in" placeholder="しゃべらせたい文章を入力"></textarea>
<div class="row"><button class="ghost" id="add">ストックに追加</button><button class="ghost" id="addf">フォルダに保存</button></div>
<div class="row"><button class="ghost" id="stop">停止</button><button class="x tg" id="ftg">フォルダ機能：オン</button></div>
<div id="fp">
<input id="fname" type="text" maxlength="30" placeholder="フォルダ名を入力">
<div id="fchips"></div>
<div class="row"><button class="m" id="fok">保存</button><button class="ghost" id="fcancel">キャンセル</button></div>
</div>
<div id="note"></div>
<div class="row">
<button class="m" id="play">再生</button>
<button class="x tg off" id="bigtg">大きく表示：オン</button>
</div>
<div class="row"><button class="f" id="rnd">返す言葉がない</button><button class="f" id="rnd2">返す言葉がない2</button></div>
<div class="speed"><span>高さ</span><input type="range" id="ptc" min="0.2" max="2" step="0.1" value="1"><span id="ptv">1.0</span></div>
<div class="speed"><span>速さ</span><input type="range" id="spd" min="0.5" max="1.4" step="0.1" value="1"><span id="spv">1.0倍</span></div>
<h2 id="lh">ストック一覧</h2>
<div id="list"></div>
<div id="mv"><div class="mvc"><div id="mvt"></div><input id="mname" type="text" maxlength="30" placeholder="移動先フォルダ名"><div id="mchips"></div><div id="mmsg"></div><div class="row"><button class="m" id="mok">移動</button><button class="ghost" id="mcancel">キャンセル</button></div></div></div>
<div id="big"><div id="bigt"></div><div id="bigh">タップで閉じる</div></div>
<script>
var KEY='voicestock:v2',OLD='voicestock:items',NONAME='フォルダ名なし',items=[],voices=[];
try{
  var raw=localStorage.getItem(KEY);
  if(raw){items=JSON.parse(raw)}
  else{
    var old=JSON.parse(localStorage.getItem(OLD)||'[]');
    items=old.map(function(t){return {t:String(t),f:''}});
    if(items.length)localStorage.setItem(KEY,JSON.stringify(items));
  }
  items=items.filter(function(x){return x&&typeof x.t==='string'}).map(function(x){return {t:x.t,f:x.f||''}});
}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(function(v){return /^ja/i.test(v.lang)})}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
else document.getElementById('note').textContent='このブラウザは音声再生に対応していません。';
function pick(re){for(var i=0;i<voices.length;i++){if(re.test(voices[i].name))return voices[i]}return null}
function speak(text){
  if(!text||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';
  u.pitch=parseFloat(document.getElementById('ptc').value);
  u.rate=parseFloat(document.getElementById('spd').value);
  if(voices[0])u.voice=voices[0];
  var my=++sid;
  showBig(text);
  speechSynthesis.speak(u);
}
var sid=0,bigOn=false,tg=document.getElementById('bigtg');
try{if(localStorage.getItem('voicestock:big')==='1')bigOn=true}catch(e){}
function showTg(){tg.textContent='大きく表示：'+(bigOn?'オン':'オフ');tg.classList.toggle('off',!bigOn)}
tg.addEventListener('click',function(){bigOn=!bigOn;if(!bigOn)hideBig();try{localStorage.setItem('voicestock:big',bigOn?'1':'0')}catch(e){}showTg()});
showTg();
function fitBig(){
  var s=document.getElementById('big'),t=document.getElementById('bigt'),w=s.clientWidth-32,h=s.clientHeight-80,lo=10,hi=600;
  while(lo<hi){var m=Math.ceil((lo+hi)/2);t.style.fontSize=m+'px';
    if(t.scrollWidth<=w+1&&t.scrollHeight<=h)lo=m;else hi=m-1;}
  t.style.fontSize=lo+'px';
}
function showBig(text){
  if(!bigOn)return;
  document.getElementById('bigt').textContent=text;
  document.getElementById('big').classList.add('on');fitBig();
}
function hideBig(){document.getElementById('big').classList.remove('on')}
function stopAll(){sid++;hideBig();if('speechSynthesis' in window)speechSynthesis.cancel()}
document.getElementById('big').addEventListener('click',stopAll);
window.addEventListener('resize',function(){if(document.getElementById('big').classList.contains('on'))fitBig()});
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function itemHtml(it,i){
  return '<div class="item"><p>'+esc(it.t)+'</p><div class="row">'
    +'<button class="m" data-i="'+i+'" data-v="p">再生</button>'
    +'<button class="ghost" data-s="1">停止</button>'
    +(folderOn?'<button class="ghost" data-m="'+i+'">移動</button>':'')
    +'<button class="ghost del" data-d="'+i+'">削除</button></div></div>';
}
function render(){
  var el=document.getElementById('list'),lh=document.getElementById('lh'),html='',i;
  if(!items.length){
    lh.textContent='ストック一覧';
    el.innerHTML='<p style="color:var(--sub);font-size:14px">まだありません。文章を入力して「ストックに追加」か「フォルダに保存」を押してください。</p>';
    return;
  }
  if(!folderOn){
    lh.textContent='ストック一覧';
    for(i=0;i<items.length;i++)html+=itemHtml(items[i],i);
  }else if(openF===null){
    lh.textContent='フォルダ一覧';
    var names=[],cnt={};
    items.forEach(function(it){var n=it.f||NONAME;if(!(n in cnt)){cnt[n]=0;names.push(n)}cnt[n]++});
    names.forEach(function(n){
      html+='<div class="item fold" data-open="'+esc(n)+'"><b>📁 '+esc(n)+'</b><span>'+cnt[n]+'件 ›</span></div>';
    });
  }else{
    var any=false;
    lh.textContent='フォルダ';
    html='<div class="fhead"><button class="ghost" data-back="1">← 一覧</button><b>📁 '+esc(openF)+'</b></div>';
    for(i=0;i<items.length;i++){
      if((items[i].f||NONAME)===openF){html+=itemHtml(items[i],i);any=true}
    }
    if(!any){openF=null;render();return}
  }
  el.innerHTML=html;
}
var inp=document.getElementById('in');
var WHEN=['今日は','昨日は','今朝は','先週は','夜は','休みの日は','昼休みに'],
    WITH=['','友達と','家族と','ひとりで','兄と','同僚と'],
    PLACE=['公園で','カフェで','家で','駅前で','海辺で','学校で','キャンプ場で','庭で'],
    ACT=['カレーを食べた','ギターを弾いた','写真を撮った','本を読んだ','手紙を書いた','絵を描いた','映画を見た','昼寝をした','ラーメンを食べた','音楽を聴いた','おしゃべりをした','ゲームをした'],
    PAIRS=[['コーヒー','苦い'],['夕焼け','きれい'],['冬の朝','寒い'],['カレー','おいしい'],['子猫','かわいい'],['月曜日','少し憂うつ'],['この曲','なつかしい'],['夏の夜','気持ちいい'],['できたてのパン','いい匂い'],['雪','冷たい']],
    DAY=['明日は','週末は','来月は','今夜は'],
    PLAN=['映画を見に行こう','海に行きたい','早く寝よう','友達に会いたい','おいしいものを食べよう','散歩に出かけよう','ゆっくり休もう'],
    POOL=['今日もおつかれさま。','深呼吸すると、少し落ち着くよ。','困ったときは、まず水を飲もう。','小さな一歩でも、進めば前に行ける。','おなかがすいたから、何か食べよう。','空がきれいだったから、写真を撮った。','最近よく笑っている気がする。','失敗しても、また明日がある。','好きなことをしている時間が、一番たのしい。','今日は早めにお風呂に入ろう。','雨の日は、家でのんびりするのもいい。','ちょっと休憩してもいいよね。','新しいことを始めるのに、遅すぎることはない。','ありがとうって言うと、気持ちがいいね。'],
    lastRnd='';
function pickOne(a){return a[Math.floor(Math.random()*a.length)]}
function randomLine(){
  var t,n=0;
  do{
    var r=Math.floor(Math.random()*5),pr;
    if(r===0)t=pickOne(POOL);
    else if(r===1||r===4)t=pickOne(WHEN)+pickOne(WITH)+pickOne(PLACE)+pickOne(ACT)+'。';
    else if(r===2){pr=pickOne(PAIRS);t=pr[0]+'は'+pr[1]+'。'}
    else t=pickOne(DAY)+pickOne(PLAN)+'。';
    n++;
  }while(t===lastRnd&&n<10);
  lastRnd=t;return t;
}
document.getElementById('rnd').addEventListener('click',function(){inp.value=randomLine()});
var REACT=[['なるほど、そういう考え方もあるね。',0],['それはすごいね！',0],['わかる、それは大変だったね。',1],['へえ、それは知らなかった。',0],['たしかに、言われてみればそうかも。',0],['それは面白い話だね。',0],['うんうん、自分もそう思う。',0],['それは意外だった。',0],['いいね、前向きで素敵だと思う。',1],['そっか、よく頑張ったね。',1],['ちょっと待って、それ本当？',0],['それは楽しそうだね！',0]],
    FOLLOW=['もう少し詳しく聞かせて。','それでどうなったの？','そのあと何かあった？','また教えてね。','今度ゆっくり聞かせてね。'],
    SUPPORT=['応援してるよ。','無理しすぎないでね。','話してくれてありがとう。'],
    lastRep='';
function randomReply(){
  var t,n=0,r;
  do{
    r=pickOne(REACT);t=r[0];
    var x=Math.random();
    if(x<0.2){}
    else if(r[1]&&x<0.7)t+=pickOne(SUPPORT);
    else t+=pickOne(FOLLOW);
    n++;
  }while(t===lastRep&&n<10);
  lastRep=t;return t;
}
document.getElementById('rnd2').addEventListener('click',function(){inp.value=randomReply()});
document.getElementById('play').addEventListener('click',function(){speak(inp.value.trim())});
document.getElementById('add').addEventListener('click',function(){
  var t=inp.value.trim();if(!t)return;items.unshift({t:t,f:''});save();render();inp.value='';
});
document.getElementById('stop').addEventListener('click',function(){stopAll()});
document.getElementById('list').addEventListener('click',function(e){
  var d=e.target.getAttribute('data-d'),i=e.target.getAttribute('data-i'),v=e.target.getAttribute('data-v'),m=e.target.getAttribute('data-m');
  var fo=e.target.closest?e.target.closest('[data-open]'):null;
  if(e.target.getAttribute('data-back')!==null){openF=null;render()}
  else if(fo){openF=fo.getAttribute('data-open');render()}
  else if(e.target.getAttribute('data-s')!==null){stopAll()}
  else if(m!==null){openMv(+m)}
  else if(d!==null){items.splice(+d,1);save();render()}
  else if(i!==null&&v)speak(items[+i].t,v);
});
var folderOn=true,openF=null;
try{if(localStorage.getItem('voicestock:folderon')==='0')folderOn=false}catch(e){}
var ftg=document.getElementById('ftg'),addf=document.getElementById('addf'),fp=document.getElementById('fp'),fname=document.getElementById('fname'),fchips=document.getElementById('fchips'),noteT=null;
function msg(m){var n=document.getElementById('note');n.textContent=m;clearTimeout(noteT);noteT=setTimeout(function(){n.textContent=''},2500)}
function showFtg(){
  ftg.textContent='フォルダ機能：'+(folderOn?'オン':'オフ');
  ftg.classList.toggle('off',!folderOn);
  addf.style.display=folderOn?'':'none';
}
function closeFp(){fp.classList.remove('on')}
addf.addEventListener('click',function(){
  if(!inp.value.trim()){msg('先に文章を入力してください。');return}
  var seen={},h='';
  items.forEach(function(it){if(it.f&&!seen[it.f]){seen[it.f]=1;h+='<button class="ghost chip" data-c="'+esc(it.f)+'">'+esc(it.f)+'</button>'}});
  fchips.innerHTML=h;fname.value='';fp.classList.add('on');
});
fchips.addEventListener('click',function(e){var c=e.target.getAttribute('data-c');if(c!==null)fname.value=c});
document.getElementById('fcancel').addEventListener('click',closeFp);
document.getElementById('fok').addEventListener('click',function(){
  var n=fname.value.trim(),t=inp.value.trim();
  if(!n){msg('フォルダ名を入力してください。');return}
  if(!t){closeFp();return}
  if(n===NONAME)n='';
  items.unshift({t:t,f:n});save();inp.value='';closeFp();render();
});
var mvIdx=-1,mv=document.getElementById('mv'),mname=document.getElementById('mname'),mchips=document.getElementById('mchips'),mmsg=document.getElementById('mmsg');
function openMv(i){
  if(!items[i])return;
  mvIdx=i;
  var cur=items[i].f||NONAME,seen={},h='';
  document.getElementById('mvt').textContent='「'+items[i].t+'」を移動（今：'+cur+'）';
  items.forEach(function(it){var n=it.f||NONAME;if(n!==cur&&!seen[n]){seen[n]=1;h+='<button class="ghost chip" data-c="'+esc(n)+'">'+esc(n)+'</button>'}});
  mchips.innerHTML=h;mname.value='';mmsg.textContent='';mv.classList.add('on');
}
function closeMv(){mv.classList.remove('on');mvIdx=-1}
mchips.addEventListener('click',function(e){var c=e.target.getAttribute('data-c');if(c!==null)mname.value=c});
document.getElementById('mcancel').addEventListener('click',closeMv);
mv.addEventListener('click',function(e){if(e.target===mv)closeMv()});
document.getElementById('mok').addEventListener('click',function(){
  var n=mname.value.trim();
  if(!n){mmsg.textContent='移動先を選ぶか、フォルダ名を入力してください。';return}
  if(mvIdx<0||!items[mvIdx])return;
  if(n===NONAME)n='';
  items[mvIdx].f=n;save();closeMv();render();
});
ftg.addEventListener('click',function(){
  folderOn=!folderOn;openF=null;closeFp();
  try{localStorage.setItem('voicestock:folderon',folderOn?'1':'0')}catch(e){}
  showFtg();render();
});
showFtg();
var spd=document.getElementById('spd'),spv=document.getElementById('spv');
try{var s0=localStorage.getItem('voicestock:speed');if(s0)spd.value=s0}catch(e){}
function showSpd(){spv.textContent=parseFloat(spd.value).toFixed(1)+'倍'}
spd.addEventListener('input',function(){showSpd();try{localStorage.setItem('voicestock:speed',spd.value)}catch(e){}});
showSpd();
var ptc=document.getElementById('ptc'),ptv=document.getElementById('ptv');
try{var p0=localStorage.getItem('voicestock:pitch');if(p0)ptc.value=p0}catch(e){}
function showPtc(){ptv.textContent=parseFloat(ptc.value).toFixed(1)}
ptc.addEventListener('input',function(){showPtc();try{localStorage.setItem('voicestock:pitch',ptc.value)}catch(e){}});
showPtc();
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
render();
</script>
</body>
</html>
